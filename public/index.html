<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard OBS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600;700;900&display=swap');

        html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }

        /* Ogni grafica ha una sua misura nativa e viene scalata/posizionata via JS.
           Parametri URL: ?scale=1.2  ?x=20 &y=20  ?align=center|right */
        .theme {
            position: absolute; left: 0; top: 0; display: none;
            transform-origin: 0 0;
            font-family: 'Titillium Web', 'Arial Narrow', Arial, sans-serif;
        }
        .theme.on { display: block; }

        /* ====================================================== SERIE A (SVG) */
        #t-seriea { width: 1710px; height: 280px; }
        #t-seriea svg { display: block; width: 1710px; height: 280px; font-family: 'Titillium Web', 'Arial Narrow', Arial, sans-serif; }

        /* ====================================================== CHAMPIONS (SVG) */
        #t-champions { width: 1440px; height: 140px; }
        #t-champions svg { display: block; width: 1440px; height: 140px; font-family: 'Titillium Web', 'Arial Narrow', Arial, sans-serif; }

        /* ====================================================== FUT */
        #t-fut { width: 1200px; height: 340px; color: #fff; }
        #t-fut .panel {
            position: absolute; top: 60px; height: 140px; width: 470px;
            display: flex; flex-direction: column; justify-content: center;
            box-sizing: border-box;
        }
        #t-fut .left  { left: 0;  align-items: flex-start; padding-left: 50px;
            clip-path: polygon(0 0, 100% 0, calc(100% - 40px) 100%, 0 100%);
            background: linear-gradient(to top, #22c55e 7px, transparent 7px), linear-gradient(135deg, #0e1330, #1f2760); }
        #t-fut .right { right: 0; align-items: flex-end; padding-right: 50px;
            clip-path: polygon(40px 0, 100% 0, 100% 100%, 0 100%);
            background: linear-gradient(to top, #ef4444 7px, transparent 7px), linear-gradient(225deg, #0e1330, #1f2760); }
        #t-fut .label { font-size: 30px; font-weight: 700; letter-spacing: 7px; color: #d9c27a; text-transform: uppercase; line-height: 1; margin-bottom: 4px; }
        #t-fut .num { font-size: 100px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 4px 10px rgba(0,0,0,.5); }
        #t-fut .center { position: absolute; left: 470px; top: 0; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
        #t-fut .center img { max-width: 250px; max-height: 250px; object-fit: contain; }
        #t-fut .center svg { width: 220px; height: 220px; }
        #t-fut .match {
            position: absolute; left: 100px; top: 272px; width: 1000px; height: 60px; box-sizing: border-box;
            display: flex; align-items: center; padding: 0 26px; gap: 14px;
            border-radius: 30px; border: 2px solid #d9c27a;
            background: linear-gradient(135deg, #0e1330, #1f2760);
            font-size: 34px; font-weight: 900; text-transform: uppercase;
        }
        #t-fut .clk { width: 150px; flex: none; font-variant-numeric: tabular-nums; color: #d9c27a; white-space: nowrap; }
        #f-extra { font-size: 20px; color: #ef4444; margin-left: 4px; }
        #t-fut .side { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
        #t-fut .side.h { justify-content: flex-end; }
        #t-fut .side img { width: 42px; height: 42px; object-fit: contain; flex: none; }
        #t-fut .side span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #t-fut .sc { flex: none; width: 140px; text-align: center; font-variant-numeric: tabular-nums; }

        /* ====================================================== POPUP CARTELLINI / SOSTITUZIONI
           In basso a sinistra. Stile Serie A (crema + blu, tagli obliqui) o Champions (blu elettrico + barra scura).
           La FUT usa lo stile Champions. Parametri URL: ?popx=40 &popy=40 (distanza da sinistra/basso) */
        #popup {
            position: absolute; left: 40px; bottom: 40px; transform-origin: 0 100%;
            display: flex; flex-direction: column; gap: 4px; width: max-content;
            font-family: 'Titillium Web', 'Arial Narrow', Arial, sans-serif;
            pointer-events: none;
        }
        .pop-row {
            display: flex; align-items: stretch; opacity: 0; transform: translateX(-130%);
            transition: transform .45s cubic-bezier(.2, .9, .25, 1), opacity .3s ease;
            filter: drop-shadow(0 5px 6px rgba(0,0,0,.45));
        }
        #popup.show .pop-row { opacity: 1; transform: none; }
        #popup.show .pop-row:nth-child(2) { transition-delay: .12s; }
        .pop-row .ic { display: flex; align-items: center; justify-content: center; flex: none; }
        .pop-row .nm { position: relative; display: flex; align-items: center; flex: 1; color: #fff; text-transform: uppercase; font-weight: 600; }
        .pop-row .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 520px; line-height: 1; }
        .pop-row .tm { margin-left: auto; padding-left: 28px; font-weight: 700; opacity: .85; line-height: 1; }
        .pop-row .kit { position: absolute; display: flex; text-decoration: none; }
        .pop-row .kit b { display: block; width: 28px; height: 4px; }
        .card { display: block; width: 28px; height: 38px; border-radius: 4px; box-shadow: 0 3px 6px rgba(0,0,0,.35); }
        .card.y { background: #ffd400; }
        .card.r { background: #e5002b; }
        .arr { width: 36px; height: 36px; display: block; }

        /* --- Serie A */
        .pop-row.sa { height: 64px; }
        .sa .ic { width: 96px; background: #f1ebcf; clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%); padding-right: 8px; box-sizing: border-box; }
        .sa .nm {
            margin-left: -16px; min-width: 400px; padding: 0 22px 8px 42px; box-sizing: border-box;
            font-size: 40px; letter-spacing: 2px;
            background: linear-gradient(#0f3474, #0a2556);
            clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
        }
        .sa .nm::before { content: ''; position: absolute; left: 0; top: 0; width: 48px; height: 100%; background: rgba(0,0,0,.3); clip-path: polygon(16px 0, 48px 0, 32px 100%, 0 100%); }
        .sa .tm { font-size: 26px; color: #f1ebcf; padding-right: 8px; }
        .sa .kit { left: 44px; bottom: 7px; gap: 4px; }
        .sa .end { width: 38px; margin-left: -10px; background: #f1ebcf; clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }

        /* --- Champions */
        .pop-row.ch { height: 56px; }
        .ch .ic { width: 64px; background: #2447ee; }
        .ch .sep { width: 6px; background: #fff; flex: none; }
        .ch .nm {
            min-width: 380px; padding: 0 22px 4px 24px; box-sizing: border-box; font-size: 36px; letter-spacing: 1.5px;
            background: linear-gradient(to bottom, rgba(255,255,255,.10), rgba(255,255,255,0)), linear-gradient(to right, #1c11a8, #110a78 50%, #1c11a8);
            border-right: 8px solid #e0243b;
        }
        .ch .tm { font-size: 24px; color: #aab6ff; }
        .ch .kit { left: 24px; bottom: 6px; }
        .ch .kit b { width: 30px; height: 4px; }
        .ch .arr, .ch .card { filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
    </style>
</head>
<body>

<!-- ============================================================ SERIE A (tutto vettoriale) -->
<div id="t-seriea" class="theme">
    <svg viewBox="0 0 1710 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="aDark" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#0f3474"/>
                <stop offset="1" stop-color="#0a2556"/>
            </linearGradient>
            <filter id="aShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".45"/>
            </filter>
        </defs>

        <!-- pannello tempo (crema) -->
        <polygon points="150,28 632,28 565,192 150,192" fill="#f1ebcf"/>
        <!-- linguetta periodo -->
        <polygon points="250,192 565,192 551,226 250,226" fill="#f1ebcf"/>
        <text id="a-period" x="268" y="210" font-size="22" font-weight="700" fill="#1b2a4a" dominant-baseline="central" letter-spacing="1.5">1° TEMPO</text>
        <text id="a-rec" x="540" y="210" font-size="22" font-weight="700" fill="#c1121f" text-anchor="end" dominant-baseline="central" letter-spacing="1.5"></text>

        <!-- pannello squadre (blu) -->
        <polygon points="632,28 1632,28 1562,192 565,192" fill="url(#aDark)"/>
        <polygon points="632,28 664,28 597,192 565,192" fill="#000" fill-opacity=".30"/>

        <!-- punteggio (crema) e finitura a destra -->
        <polygon points="1018,28 1252,28 1182,192 948,192" fill="#f1ebcf"/>
        <polygon points="1640,28 1698,28 1628,192 1570,192" fill="#f1ebcf"/>

        <!-- logo competizione -->
        <image id="a-logo" x="0" y="2" width="240" height="276" preserveAspectRatio="xMidYMid meet" filter="url(#aShadow)" href="seriea-logo.png"/>

        <!-- tempo -->
        <text id="a-time" x="419" y="112" font-size="84" font-weight="600" fill="#15171a" text-anchor="middle" dominant-baseline="central" letter-spacing="2"><tspan id="a-time-main">00:00</tspan><tspan id="a-time-extra" font-size="38" font-weight="700" fill="#c1121f" dx="8"></tspan></text>

        <!-- squadre -->
        <image id="a-home-logo" x="625" y="64" width="92" height="92" preserveAspectRatio="xMidYMid meet" display="none"/>
        <text id="a-home-name" x="850" y="104" font-size="92" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central" letter-spacing="3">INT</text>
        <g id="a-kit-home"></g>

        <text id="a-score" x="1100" y="112" font-size="90" font-weight="600" fill="#15171a" text-anchor="middle" dominant-baseline="central" letter-spacing="4">0-0</text>

        <text id="a-away-name" x="1354" y="104" font-size="92" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central" letter-spacing="3">MIL</text>
        <g id="a-kit-away"></g>
        <image id="a-away-logo" x="1470" y="64" width="92" height="92" preserveAspectRatio="xMidYMid meet" display="none"/>
    </svg>
</div>

<!-- ============================================================ CHAMPIONS (tutto vettoriale) -->
<div id="t-champions" class="theme">
    <svg viewBox="0 0 1440 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="cDark" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#1c11a8"/>
                <stop offset="0.5" stop-color="#110a78"/>
                <stop offset="1" stop-color="#1c11a8"/>
            </linearGradient>
            <linearGradient id="cGloss" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
        </defs>

        <!-- riquadro logo competizione -->
        <rect x="0" y="0" width="100" height="100" fill="#2447ee"/>
        <g id="c-ball" transform="translate(50 50)"></g>
        <image id="c-center-logo" x="10" y="10" width="80" height="80" preserveAspectRatio="xMidYMid meet" display="none"/>

        <!-- pannello tempo + linguetta periodo -->
        <rect x="100" y="0" width="340" height="100" fill="#edeff8"/>
        <path d="M100 100 H330 V120 Q330 134 316 134 H114 Q100 134 100 120 Z" fill="#edeff8"/>
        <text id="c-period" x="118" y="118" font-size="18" font-weight="700" fill="#5b6390" dominant-baseline="central" letter-spacing="1.5">1° TEMPO</text>
        <text id="c-rec" x="316" y="118" font-size="18" font-weight="700" fill="#c1121f" text-anchor="end" dominant-baseline="central" letter-spacing="1.5"></text>
        <text x="270" y="52" font-size="62" font-weight="600" fill="#1d2563" text-anchor="middle" dominant-baseline="central" letter-spacing="3"><tspan id="c-time-main">00:00</tspan><tspan id="c-time-extra" font-size="26" font-weight="700" fill="#e5002b" dx="8"></tspan></text>

        <!-- barra bianca di separazione -->
        <rect x="440" y="0" width="16" height="100" fill="#fff"/>

        <!-- barra squadre -->
        <rect x="456" y="0" width="970" height="100" fill="url(#cDark)"/>
        <rect x="456" y="0" width="970" height="100" fill="url(#cGloss)"/>
        <rect x="1426" y="0" width="14" height="100" fill="#e0243b"/>

        <!-- decorazioni intorno al punteggio -->
        <path d="M 821 34 Q 835 50 821 66" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
        <path d="M 1061 34 Q 1047 50 1061 66" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
        <line x1="941" y1="28" x2="941" y2="72" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>

        <!-- squadre e punteggio -->
        <image id="c-home-logo" x="480" y="18" width="64" height="64" preserveAspectRatio="xMidYMid meet" display="none"/>
        <text id="c-home-name" x="560" y="46" font-size="56" font-weight="600" fill="#fff" dominant-baseline="central" letter-spacing="2">INT</text>
        <g id="c-kit-home"></g>
        <text id="c-home-score" x="889" y="53" font-size="64" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">0</text>
        <text id="c-away-score" x="993" y="53" font-size="64" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">0</text>
        <text id="c-away-name" x="1326" y="46" font-size="56" font-weight="600" fill="#fff" text-anchor="end" dominant-baseline="central" letter-spacing="2">MIL</text>
        <g id="c-kit-away"></g>
        <image id="c-away-logo" x="1342" y="18" width="64" height="64" preserveAspectRatio="xMidYMid meet" display="none"/>
    </svg>
</div>

<!-- ============================================================ FUT -->
<div id="t-fut" class="theme">
    <div class="panel left">
        <div class="label">Vittorie</div>
        <div id="f-wins" class="num">0</div>
    </div>

    <div class="center">
        <img id="f-logo" style="display:none" alt="">
        <svg id="f-placeholder" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="fShield" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#c8102e"/><stop offset="1" stop-color="#7a0a1c"/>
                </linearGradient>
            </defs>
            <path d="M100 8 L186 40 L186 120 Q186 178 100 212 Q14 178 14 120 L14 40 Z" fill="url(#fShield)" stroke="#e8c867" stroke-width="7" stroke-linejoin="round"/>
            <text x="100" y="118" font-size="64" font-weight="900" fill="#e8c867" text-anchor="middle" font-family="Titillium Web, Arial, sans-serif">FUT</text>
            <text x="100" y="152" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="3" font-family="Titillium Web, Arial, sans-serif">CHAMPIONS</text>
        </svg>
    </div>

    <div class="panel right">
        <div class="label">Sconfitte</div>
        <div id="f-losses" class="num">0</div>
    </div>

    <div id="f-match" class="match">
        <div class="clk"><span id="f-clock">00:00</span><span id="f-extra"></span></div>
        <div class="side h"><span id="f-home-name">INT</span><img id="f-home-logo" style="display:none" alt=""></div>
        <div class="sc"><span id="f-home-score">0</span> - <span id="f-away-score">0</span></div>
        <div class="side a"><img id="f-away-logo" style="display:none" alt=""><span id="f-away-name">MIL</span></div>
        <div class="clk" style="visibility:hidden"></div>
    </div>
</div>

<!-- ============================================================ POPUP CARTELLINI / SOSTITUZIONI -->
<div id="popup"></div>

<script>
    const API = '';
    const PERIOD_LABEL = { '1T': '1° TEMPO', 'INT': 'INTERVALLO', '2T': '2° TEMPO', '1TS': '1° SUPPL.', '2TS': '2° SUPPL.', 'FIN': 'FINALE' };
    const pad = n => String(n).padStart(2, '0');
    const $ = id => document.getElementById(id);

    // ---- misure e posizione: ?scale=1.2  ?x=20&y=20  ?align=center|right
    const params = new URLSearchParams(location.search);
    const userScale = parseFloat(params.get('scale')) || 1;
    const offX = params.has('x') ? parseInt(params.get('x'), 10) || 0 : 20;
    const offY = params.has('y') ? parseInt(params.get('y'), 10) || 0 : 20;
    const align = params.get('align') || 'left';
    const THEMES = {
        seriea:    { el: 't-seriea',    w: 1710, scale: 0.55 },
        champions: { el: 't-champions', w: 1440, scale: 0.75 },
        fut:       { el: 't-fut',       w: 1200, scale: 0.6  }
    };

    function applyTheme(name) {
        for (const [key, t] of Object.entries(THEMES)) {
            const el = $(t.el);
            const on = key === name;
            el.classList.toggle('on', on);
            if (!on) continue;
            const s = t.scale * userScale;
            const w = t.w * s;
            let left = offX;
            if (align === 'center') left = (innerWidth - w) / 2;
            else if (align === 'right') left = innerWidth - w - offX;
            el.style.transform = `scale(${s})`;
            el.style.left = left + 'px';
            el.style.top = offY + 'px';
        }
    }

    // ---- palla di stelle vettoriale (si vede finche' non carichi un logo competizione)
    (function buildBall() {
        const g = $('c-ball'), NS = 'http://www.w3.org/2000/svg';
        const star = (cx, cy, R) => {
            const pts = [];
            for (let i = 0; i < 10; i++) {
                const r = i % 2 ? R * 0.42 : R, a = -Math.PI / 2 + i * Math.PI / 5;
                pts.push((cx + r * Math.cos(a)).toFixed(2) + ',' + (cy + r * Math.sin(a)).toFixed(2));
            }
            const p = document.createElementNS(NS, 'polygon');
            p.setAttribute('points', pts.join(' ')); p.setAttribute('fill', '#fff');
            g.appendChild(p);
        };
        const ring = document.createElementNS(NS, 'circle');
        ring.setAttribute('r', 35); ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', '#fff'); ring.setAttribute('stroke-width', 3);
        g.appendChild(ring);
        star(0, 0, 12);
        for (let i = 0; i < 5; i++) {
            const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
            star(24 * Math.cos(a), 24 * Math.sin(a), 7);
        }
    })();

    // ---- helper
    function logoSrc(team, S) { return `${API}/api/logo?team=${team}&v=${S.logoV[team]}`; }

    function setHtmlImg(id, team, S) {                 // <img>
        const img = $(id);
        if (S.hasLogo[team]) {
            const src = logoSrc(team, S);
            if (img.getAttribute('src') !== src) img.src = src;
            img.style.display = '';
        } else { img.style.display = 'none'; img.removeAttribute('src'); }
    }
    function setSvgImg(id, team, S) {                  // <image> dentro l'SVG
        const img = $(id);
        if (S.hasLogo[team]) {
            const src = logoSrc(team, S);
            if (img.getAttribute('href') !== src) img.setAttribute('href', src);
            img.setAttribute('display', 'inline');
        } else { img.setAttribute('display', 'none'); img.removeAttribute('href'); }
    }
    function fitSvg(el, maxW, base) {                  // rimpicciolisce il testo SVG che non ci sta
        let size = base;
        el.setAttribute('font-size', size);
        while (el.getComputedTextLength() > maxW && size > 24) { size -= 2; el.setAttribute('font-size', size); }
    }
    const NS = 'http://www.w3.org/2000/svg';
    function rect(g, x, y, w, h, fill) {
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x.toFixed(1)); r.setAttribute('y', y); r.setAttribute('width', w.toFixed(1));
        r.setAttribute('height', h); r.setAttribute('fill', fill); g.appendChild(r);
    }
    // Serie A: fila di trattini sotto il nome, meta' colore 1 e meta' colore 2
    function kitDashes(gId, textEl, c1, c2) {
        const bb = textEl.getBBox();
        const key = [bb.x.toFixed(0), bb.width.toFixed(0), c1, c2].join('|');
        const g = $(gId);
        if (g.dataset.key === key) return;
        g.dataset.key = key; g.textContent = '';
        const n = Math.max(3, Math.floor((bb.width + 7) / 27));
        const x0 = bb.x + bb.width / 2 - (n * 27 - 7) / 2;
        for (let i = 0; i < n; i++) rect(g, x0 + i * 27, 166, 20, 5, i < Math.ceil(n / 2) ? c1 : c2);
    }
    // Champions: barretta sotto il nome, divisa a meta'
    function kitBar(gId, textEl, c1, c2) {
        const bb = textEl.getBBox();
        const key = [bb.x.toFixed(0), bb.width.toFixed(0), c1, c2].join('|');
        const g = $(gId);
        if (g.dataset.key === key) return;
        g.dataset.key = key; g.textContent = '';
        const half = bb.width / 2;
        rect(g, bb.x, 78, half, 6, c1);
        rect(g, bb.x + half, 78, half, 6, c2);
    }

    // ---- render per grafica (dati che cambiano di rado)
    function renderSerieA(S) {
        const hasH = S.hasLogo.home, hasA = S.hasLogo.away;
        setSvgImg('a-home-logo', 'home', S);
        setSvgImg('a-away-logo', 'away', S);
        // logo competizione: quello caricato per la Serie A, altrimenti quello di default
        const logo = $('a-logo');
        const src = S.hasLogo.seriea ? logoSrc('seriea', S) : 'seriea-logo.png';
        if (logo.getAttribute('href') !== src) logo.setAttribute('href', src);

        const hn = $('a-home-name'), an = $('a-away-name');
        hn.textContent = S.homeName.toUpperCase();
        an.textContent = S.awayName.toUpperCase();
        hn.setAttribute('x', hasH ? 850 : 800);
        an.setAttribute('x', hasA ? 1354 : 1405);
        fitSvg(hn, hasH ? 210 : 290, 92);
        fitSvg(an, hasA ? 200 : 290, 92);
        kitDashes('a-kit-home', hn, S.homeKit1, S.homeKit2);
        kitDashes('a-kit-away', an, S.awayKit1, S.awayKit2);

        const sc = $('a-score');
        sc.textContent = S.homeScore + '-' + S.awayScore;
        fitSvg(sc, 200, 90);
        $('a-period').textContent = PERIOD_LABEL[S.period] || S.period;
        $('a-rec').textContent = (S.injuryTime > 0 && S.periodEnd !== null) ? 'REC +' + S.injuryTime : '';
    }

    function renderChampions(S) {
        const hasH = S.hasLogo.home, hasA = S.hasLogo.away, hasC = S.hasLogo.champions;
        setSvgImg('c-home-logo', 'home', S);
        setSvgImg('c-away-logo', 'away', S);
        setSvgImg('c-center-logo', 'champions', S);
        $('c-ball').setAttribute('display', hasC ? 'none' : 'inline');

        const hn = $('c-home-name'), an = $('c-away-name');
        hn.textContent = S.homeName.toUpperCase();
        an.textContent = S.awayName.toUpperCase();
        hn.setAttribute('x', hasH ? 560 : 496);
        an.setAttribute('x', hasA ? 1326 : 1386);
        fitSvg(hn, hasH ? 245 : 309, 56);
        fitSvg(an, hasA ? 245 : 309, 56);
        kitBar('c-kit-home', hn, S.homeKit1, S.homeKit2);
        kitBar('c-kit-away', an, S.awayKit1, S.awayKit2);

        $('c-home-score').textContent = S.homeScore;
        $('c-away-score').textContent = S.awayScore;
        $('c-period').textContent = PERIOD_LABEL[S.period] || S.period;
        $('c-rec').textContent = (S.injuryTime > 0 && S.periodEnd !== null) ? 'REC +' + S.injuryTime : '';
    }

    function renderFut(S) {
        $('f-wins').textContent = S.wins;
        $('f-losses').textContent = S.losses;
        setHtmlImg('f-logo', 'fut', S);
        $('f-placeholder').style.display = S.hasLogo.fut ? 'none' : '';
        $('f-match').style.display = S.futShowMatch ? '' : 'none';
        $('f-home-name').textContent = S.homeName;
        $('f-away-name').textContent = S.awayName;
        $('f-home-score').textContent = S.homeScore;
        $('f-away-score').textContent = S.awayScore;
        setHtmlImg('f-home-logo', 'home', S);
        setHtmlImg('f-away-logo', 'away', S);
    }

    function applyStatic(S) {
        applyTheme(S.theme);
        if (S.theme === 'champions') renderChampions(S);
        else if (S.theme === 'fut') renderFut(S);
        else renderSerieA(S);
    }


    // ---- popup cartellini / sostituzioni (basso a sinistra)
    const popup = $('popup');
    popup.style.left = (params.has('popx') ? parseInt(params.get('popx'), 10) || 0 : 40) + 'px';
    popup.style.bottom = (params.has('popy') ? parseInt(params.get('popy'), 10) || 0 : 40) + 'px';
    popup.style.transform = `scale(${userScale})`;

    const ARROW = 'M12 3 L22 15 H15 V21 H9 V15 H2 Z';
    const POP_ICON = {
        yellow: '<i class="card y"></i>',
        red:    '<i class="card r"></i>',
        in:     `<svg class="arr" viewBox="0 0 24 24"><path d="${ARROW}" fill="#22c55e"/></svg>`,
        out:    `<svg class="arr" viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="${ARROW}" fill="#ef4444"/></svg>`
    };
    let popId = null, popHideT = null, popClearT = null;

    function popRow(style, kind, name, S, team) {
        const row = document.createElement('div');
        row.className = 'pop-row ' + style;
        const body = '<div class="nm"><span class="pn"></span><span class="tm"></span><u class="kit"><b></b><b></b></u></div>';
        row.innerHTML = `<div class="ic">${POP_ICON[kind]}</div>` + (style === 'sa' ? body + '<div class="end"></div>' : '<div class="sep"></div>' + body);
        row.querySelector('.pn').textContent = name;                          // textContent: niente HTML dai nomi
        row.querySelector('.tm').textContent = (team === 'home' ? S.homeName : S.awayName).toUpperCase();
        const [b1, b2] = row.querySelectorAll('.kit b');
        b1.style.background = S[team + 'Kit1'];
        b2.style.background = S[team + 'Kit2'];
        return row;
    }

    function hidePopup() {
        clearTimeout(popHideT);
        popup.classList.remove('show');
        clearTimeout(popClearT);
        popClearT = setTimeout(() => { popup.textContent = ''; }, 900);
    }

    function showPopup(ev, S, remainMs) {
        clearTimeout(popHideT); clearTimeout(popClearT);
        const style = S.theme === 'seriea' ? 'sa' : 'ch';     // Serie A -> Serie A, Champions e FUT -> Champions
        popup.className = '';
        popup.textContent = '';
        if (ev.type === 'sub') {
            popup.append(popRow(style, 'in', ev.playerIn, S, ev.team), popRow(style, 'out', ev.playerOut, S, ev.team));
        } else {
            popup.append(popRow(style, ev.type, ev.name, S, ev.team));
        }
        void popup.offsetWidth;                                // forza il layout: parte l'animazione d'ingresso
        popup.classList.add('show');
        popHideT = setTimeout(hidePopup, remainMs);
    }

    function handleEvent(S) {
        const ev = S.event;
        if (ev && ev.id !== popId) {
            popId = ev.id;
            const remain = ev.durationMs - ev.ageMs;
            if (remain > 800) showPopup(ev, S, remain);        // se ricarichi OBS a popup quasi finito non riparte
        } else if (!ev && popId !== null) {
            popId = null;
            hidePopup();
        }
    }

    // ---- cronometro: interpolato in locale ogni 100 ms a partire dal valore del server
    let S = null, fetchedAt = 0;
    function tick() {
        if (!S) return;
        const el = S.elapsedMs + (S.running ? performance.now() - fetchedAt : 0);
        let total = Math.floor(Math.max(0, el) / 1000);
        let extra = '';
        // Oltre 45'/90'/105'/120' il tempo resta fermo e il recupero effettivo va a parte: 45:00 +2:13
        if (S.periodEnd !== null && total > S.periodEnd * 60) {
            const e = total - S.periodEnd * 60;
            extra = '+' + Math.floor(e / 60) + ':' + pad(e % 60);
            total = S.periodEnd * 60;
        }
        const main = pad(Math.floor(total / 60)) + ':' + pad(total % 60);
        $('a-time-main').textContent = main;     $('a-time-extra').textContent = extra;
        $('a-time').setAttribute('font-size', extra ? 70 : 84);
        $('c-time-main').textContent = main;     $('c-time-extra').textContent = extra;
        $('f-clock').textContent = main;         $('f-extra').textContent = extra;
    }

    // Firma dei dati "statici" (tutto tranne il tempo che scorre): se non cambia, non si ricalcola il layout SVG
    let lastSig = null;
    const staticSig = s => JSON.stringify({ ...s, elapsedMs: 0, event: null });   // il popup ha il suo percorso: ageMs cambia a ogni lettura

    async function poll() {
        try {
            const t0 = performance.now();
            const res = await fetch(API + '/api/get', { cache: 'no-store' });
            const data = await res.json();
            if (!res.ok) return;
            S = data;
            fetchedAt = (t0 + performance.now()) / 2;   // compensa meta' della latenza di rete
            const sig = staticSig(S);
            if (sig !== lastSig) { lastSig = sig; applyStatic(S); }
            handleEvent(S);
            tick();
        } catch (e) { /* offline: tiene l'ultimo stato */ }
    }

    // Quando il font reale e' pronto (o arriva dopo) le misure del testo cambiano:
    // si svuotano le cache dei trattini/barre colore e si ricalcola tutto una volta.
    function relayout() {
        for (const id of ['a-kit-home', 'a-kit-away', 'c-kit-home', 'c-kit-away']) delete $(id).dataset.key;
        if (S) applyStatic(S);
    }
    document.fonts.ready.then(relayout);
    document.fonts.addEventListener('loadingdone', relayout);
    addEventListener('resize', () => { if (S) applyStatic(S); });

    setInterval(poll, 1000);
    setInterval(tick, 100);
    poll();
</script>
</body>
</html>
